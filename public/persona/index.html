<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>페르소나 · UXA</title>
  <meta name="description" content="인터뷰 기록에서 핵심 사용자 유형을 페르소나로 정리합니다." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f7fb;
      --text: #14161f;
      --text-sub: #5b6072;
      --text-faint: #a3a7b7;
      --line: #e4e6ee;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --radius: 16px;
      --max: 1160px;

      /* 페르소나 테마 (문서 화면과 같은 변수) */
      --persona-badge-bg: #d9f7a3;
      --persona-badge-text: #2d4a12;
      --persona-badge-secondary-bg: #e3e8ff;
      --persona-badge-secondary-text: #2d3a8c;
      --persona-badge-tertiary-bg: #f1f3f7;
      --persona-badge-tertiary-text: #4b4f5c;
      --persona-panel-bg: #2a2a2e;
      --persona-photo-bg: #3b3b41;
      --persona-photo-fg: #6a6a72;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; min-height: 100vh;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; word-break: keep-all;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

    /* 내비게이션 (랜딩과 동일) */
    .nav { position: sticky; top: 0; z-index: 10; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .nav .container { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 64px; }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .nav nav { min-width: 0; }
    .menu { display: flex; gap: 4px; list-style: none; overflow-x: auto; }
    .menu a { display: block; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--text-sub); white-space: nowrap; }
    .menu a:hover { background: var(--accent-soft); color: var(--accent); }
    .menu a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

    /* 본문 */
    main { flex: 1; padding: 72px 0 100px; background: var(--bg-soft); }
    .page-head { text-align: center; margin-bottom: 40px; }
    .page-head .num { display: inline-grid; place-items: center; width: 44px; height: 44px; margin-bottom: 16px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; }
    .page-head h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
    .page-head p { margin-top: 12px; font-size: 17px; color: var(--text-sub); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-accent { border-color: var(--accent); background: var(--accent); color: #fff; }
    .btn-accent:hover { background: #4338ca; color: #fff; }

    .listbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    .listbar .total { font-size: 14.5px; color: var(--text-sub); }
    .listbar .total b { color: var(--text); font-weight: 700; }

    /* 프로젝트 묶음 */
    .project { margin-top: 36px; }
    .project:first-of-type { margin-top: 0; }
    .project-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .project-head h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .project-head .meta { font-size: 13px; color: var(--text-sub); }
    .project-head .meta span + span::before { content: "·"; margin: 0 6px; color: var(--text-faint); }

    /* 카드 그리드 */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 10px 28px rgba(20, 22, 31, .08); }
    .thumb { position: relative; aspect-ratio: 4 / 3; background: var(--persona-photo-bg); overflow: hidden; }
    .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .thumb svg { display: block; width: 100%; height: 100%; color: var(--persona-photo-fg); }
    .thumb::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(to bottom, transparent, rgba(42, 42, 46, .85)); }
    .thumb .name { position: absolute; left: 16px; bottom: 12px; z-index: 1; color: #fff; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .thumb .name small { display: block; font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, .8); }
    .badge {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
      background: var(--persona-badge-bg); color: var(--persona-badge-text);
    }
    .badge[data-priority="secondary"] { background: var(--persona-badge-secondary-bg); color: var(--persona-badge-secondary-text); }
    .badge[data-priority="tertiary"] { background: var(--persona-badge-tertiary-bg); color: var(--persona-badge-tertiary-text); }
    .card-body { padding: 14px 16px 16px; }
    .card-body .tagline { font-size: 14px; line-height: 1.55; color: var(--text-sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-body .tagline strong { color: var(--text); font-weight: 700; }
    .card-foot { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--text-faint); }

    /* 새 페르소나 만들기 카드 */
    .card.add {
      align-items: center; justify-content: center; gap: 8px; min-height: 240px; padding: 24px; text-align: center;
      border-style: dashed; background: transparent; color: var(--text-sub);
    }
    .card.add:hover { background: #fff; color: var(--accent); }
    .card.add .plus { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 26px; font-weight: 300; line-height: 1; }
    .card.add b { font-size: 15px; font-weight: 700; }
    .card.add small { font-size: 13px; }

    /* 샘플 */
    .sample-badge { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: var(--persona-badge-bg); color: var(--persona-badge-text); font-size: 12px; font-weight: 700; vertical-align: 3px; }
    .sample-note { margin-top: 12px; font-size: 13.5px; color: var(--text-sub); }
    .sample-note a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .card .chatlink { margin-top: 10px; display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); }
    .card .chatlink:hover { text-decoration: underline; }

    /* 비었을 때 */
    .empty { padding: 56px 24px; text-align: center; background: #fff; border: 1px dashed var(--line); border-radius: var(--radius); }
    .empty h2 { font-size: 18px; font-weight: 700; }
    .empty p { max-width: 400px; margin: 6px auto 18px; font-size: 14.5px; color: var(--text-sub); }

    /* 푸터 (랜딩과 동일) */
    footer { padding: 40px 0; border-top: 1px solid var(--line); }
    footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--text-sub); }
    footer .logo { font-size: 18px; color: var(--text); }

    @media (max-width: 640px) {
      .nav .container { flex-direction: column; align-items: flex-start; height: auto; padding-top: 12px; padding-bottom: 8px; gap: 6px; }
      .nav nav { width: 100%; }
      .menu a { padding: 8px 12px 8px 0; }
      .menu a[aria-current="page"] { padding-left: 12px; }
      main { padding: 48px 0 72px; }
      .container { padding: 0 16px; }
      .page-head { margin-bottom: 28px; }
      .listbar { flex-direction: column; align-items: stretch; }
      .listbar .btn { width: 100%; }
      .project-head { flex-direction: column; gap: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .thumb .name { font-size: 17px; left: 12px; }
      .card-body { padding: 12px; }
      .card.add { min-height: 180px; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container">
      <a href="../index.html" class="logo">UX<span>A</span></a>
      <nav aria-label="에이전트 메뉴">
        <ul class="menu">
          <li><a href="../guide/index.html">인터뷰 가이드</a></li>
          <li><a href="../moderator/index.html">인터뷰 모더레이터</a></li>
          <li><a href="../persona/index.html" aria-current="page">페르소나</a></li>
          <li><a href="../journey/index.html">저니맵</a></li>
          <li><a href="../scenario/index.html">시나리오 보드</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <span class="num">3</span>
        <h1>페르소나</h1>
        <p>인터뷰 기록에서 핵심 사용자 유형을 페르소나로 정리합니다.</p>
      </div>

      <div class="listbar">
        <p class="total" id="total"></p>
        <a class="btn btn-accent" href="/persona/new/">+ 새 페르소나 만들기</a>
      </div>

      <div id="projects"></div>

      <!-- 로그인 없이 써 보는 샘플 -->
      <section class="project sample" id="sample" hidden aria-labelledby="sampleTitle">
        <div class="project-head">
          <h2 id="sampleTitle">샘플 페르소나 <span class="sample-badge">로그인 없이 체험</span></h2>
          <p class="meta"><span>OTT 콘텐츠 추천 서비스</span><span>가상 인터뷰 4명</span><span>문서 · 대화 체험</span></p>
        </div>
        <div class="grid" id="sampleGrid"></div>
        <p class="sample-note" id="sampleNote"></p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <span class="logo">UXA · UX Agents</span>
      <span>만든 사람 [내 이름] · © 2026</span>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    // GET /api/personas → { projects: [{ id, name, kind, interviews, sessions, session_id, updated_at, personas: [...] }] }
    const PRIORITY_LABEL = { primary: "Primary Persona", secondary: "Secondary Persona", tertiary: "Tertiary Persona" };
    const KIND_LABEL = { design: "Design", marketing: "Marketing" };
    const fmtDate = (sec) => (sec ? new Date(sec * 1000).toLocaleDateString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit" }) : "");

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const emph = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const SILHOUETTE = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="120" cy="72" r="38" fill="currentColor"/><path d="M40 190c0-46 36-78 80-78s80 32 80 78" fill="currentColor"/></svg>`;

    function card(p) {
      return `
        <a class="card" href="/persona/view/?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name)} 페르소나 열기">
          <div class="thumb">
            <span class="badge" data-priority="${esc(p.priority)}">${esc(PRIORITY_LABEL[p.priority] || "")}</span>
            ${p.photoUrl ? `<img src="${esc(p.photoUrl)}" alt="" />` : SILHOUETTE}
            <span class="name">${esc(p.name)}<small>${esc(p.job)} · ${esc(p.age)}세</small></span>
          </div>
          <div class="card-body">
            <p class="tagline">${emph(p.tagline)}</p>
            <div class="card-foot"><span>${p.share ? esc(p.share) + " · " : ""}${fmtDate(p.updatedAt)}</span><span>문서 열기 →</span></div>
          </div>
        </a>`;
    }

    function render(projects) {
      const total = projects.reduce((n, pj) => n + pj.personas.length, 0);
      $("total").innerHTML = `프로젝트 <b>${projects.length}</b>개 · 페르소나 <b>${total}</b>명`;
      if (!projects.length) {
        $("projects").innerHTML = `
          <div class="empty">
            <h2>아직 만든 페르소나가 없어요</h2>
            <p>모더레이터로 진행한 인터뷰 기록을 고르면 핵심 사용자 유형을 페르소나로 정리해 드려요.</p>
            <a class="btn btn-accent" href="/persona/new/">새 페르소나 만들기</a>
          </div>`;
        return;
      }
      $("projects").innerHTML = projects.map((pj, i) => `
        <section class="project" aria-labelledby="pj-${i}">
          <div class="project-head">
            <h2 id="pj-${i}">${esc(pj.name)}</h2>
            <p class="meta"><span>${esc(KIND_LABEL[pj.kind] || "Design")}</span>${pj.sessions?.length ? `<span>${esc(pj.sessions.join(", "))}</span>` : ""}<span>인터뷰 ${esc(pj.interviews)}건</span><span>페르소나 ${pj.personas.length}명</span><span>${fmtDate(pj.updated_at)}</span></p>
          </div>
          <div class="grid">
            ${pj.personas.map(card).join("")}
            <a class="card add" href="/persona/new/${pj.session_id ? `?session=${encodeURIComponent(pj.session_id)}` : ""}">
              <span class="plus">+</span>
              <b>다시 만들기</b>
              <small>같은 인터뷰로 다른 조건의 페르소나 만들기</small>
            </a>
          </div>
        </section>`).join("");
    }

    // 샘플 (로그인 없이) — GET /api/personas/sample
    async function loadSample(loggedIn) {
      const { res, data } = await UXA.api("/api/personas/sample");
      if (!res.ok) return;
      const p = data.persona;
      $("sample").hidden = false;
      $("sampleGrid").innerHTML = card({ id: p.id, priority: p.priority, photoUrl: p.photoUrl, name: p.profile.name, job: p.profile.job, age: p.profile.age, tagline: p.tagline, share: p.share, updatedAt: p.updatedAt });
      $("sampleNote").innerHTML = loggedIn
        ? "샘플은 고칠 수 없지만 문서 보기와 대화는 자유롭게 써 볼 수 있어요."
        : `샘플 문서를 열어 보고 페르소나와 대화해 보세요. 내 인터뷰로 페르소나를 만들려면 <a href="${UXA.loginUrl("/persona/")}">로그인</a>이 필요해요.`;
    }

    async function load() {
      const loggedIn = !!UXA.getSession();
      if (!loggedIn) {
        $("total").innerHTML = `로그인하면 내 인터뷰로 만든 페르소나가 여기에 모여요.`;
        $("projects").innerHTML = "";
        document.querySelector(".listbar .btn").href = UXA.loginUrl("/persona/new/");
        loadSample(false);
        return;
      }
      $("total").textContent = "불러오는 중…";
      const [{ res, data }] = await Promise.all([UXA.api("/api/personas"), loadSample(true)]);
      if (res.status === 401) { UXA.clearSession(); load(); return; }
      if (!res.ok) { $("total").textContent = ""; $("projects").innerHTML = `<div class="empty"><h2>목록을 불러오지 못했어요</h2><p>${esc(data.error || "잠시 후 다시 시도해 주세요.")}</p></div>`; return; }
      render(data.projects || []);
    }
    load();
  </script>
</body>
</html>
