<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>페르소나와 대화 · AI Tools for UX Design</title>
  <meta name="robots" content="noindex" />
  <script>
    // 대화는 페르소나 문서 아래 섹션으로 옮겼다 — 예전 링크(/persona/chat/?id=…)는 문서의 대화 섹션으로 보낸다
    const id = new URLSearchParams(location.search).get("id") || "sample";
    location.replace(`/persona/view/?id=${encodeURIComponent(id)}#chat`);
  </script>
</head>
<body></body>
</html>
