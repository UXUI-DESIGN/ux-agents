<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 · UXA</title>
  <meta name="description" content="UXA에 로그인하고 저장한 리서치 작업을 이어서 하세요." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f7fb;
      --text: #14161f;
      --text-sub: #5b6072;
      --text-faint: #a3a7b7;
      --line: #e4e6ee;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --danger: #d92d20;
      --good: #12805c;
      --radius: 16px;
      --max: 1160px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; min-height: 100vh;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

    /* 내비게이션 (랜딩과 동일) */
    .nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .nav .container {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; height: 64px;
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .nav nav { min-width: 0; }
    .menu { display: flex; gap: 4px; list-style: none; overflow-x: auto; }
    .menu a {
      display: block; padding: 8px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 500; color: var(--text-sub); white-space: nowrap;
    }
    .menu a:hover { background: var(--accent-soft); color: var(--accent); }

    /* 본문 */
    main { flex: 1; padding: 72px 0 100px; background: var(--bg-soft); }
    .auth-card { max-width: 440px; margin: 0 auto; padding: 36px 32px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
    .auth-card h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
    .auth-card .sub { margin-top: 6px; font-size: 15px; color: var(--text-sub); }

    .field { margin-top: 22px; }
    .field > label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .text-input {
      display: block; width: 100%; padding: 11px 14px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff;
      font-size: 15px; transition: border-color .15s, box-shadow .15s;
    }
    .text-input::placeholder { color: var(--text-faint); }
    .text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .text-input.invalid { border-color: var(--danger); }
    .text-input.valid { border-color: var(--good); }
    .input-wrap .text-input { padding-right: 64px; }
    .toggle-pw {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      padding: 4px 8px; border: 0; border-radius: 6px; background: none;
      font-size: 12.5px; font-weight: 600; color: var(--text-sub); cursor: pointer;
    }
    .toggle-pw:hover { background: var(--bg-soft); color: var(--accent); }



    .remember { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 14px; cursor: pointer; }
    .remember input { width: 17px; height: 17px; accent-color: var(--accent); }
    .remember small { color: var(--text-faint); }
    .btn-primary {
      display: block; width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { opacity: .6; cursor: progress; }
    .form-error { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #fff4f3; color: #7a271a; font-size: 14px; }
    .form-error.show { display: block; }
    .switch { margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-sub); }
    .switch a { color: var(--accent); font-weight: 700; }

    /* 푸터 (랜딩과 동일) */
    footer { padding: 40px 0; border-top: 1px solid var(--line); }
    footer .container {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
      font-size: 14px; color: var(--text-sub);
    }
    footer .logo { font-size: 18px; color: var(--text); }

    @media (max-width: 640px) {
      .container { padding: 0 16px; }
      .nav .container { flex-direction: column; align-items: flex-start; height: auto; padding-top: 12px; padding-bottom: 8px; gap: 6px; }
      .nav nav { width: 100%; }
      .menu a { padding: 8px 12px 8px 0; }
      main { padding: 40px 0 72px; }
      .auth-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container">
      <a href="../index.html" class="logo">UX<span>A</span></a>
      <nav aria-label="에이전트 메뉴">
        <ul class="menu">
          <li><a href="../guide/index.html">인터뷰 가이드</a></li>
          <li><a href="../moderator/index.html">인터뷰 모더레이터</a></li>
          <li><a href="../persona/index.html">페르소나</a></li>
          <li><a href="../journey/index.html">저니맵</a></li>
          <li><a href="../scenario/index.html">시나리오 보드</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <form class="auth-card" id="loginForm" novalidate>
        <h1>로그인</h1>
        <p class="sub" id="loginSub">저장한 리서치 작업을 이어서 하려면 로그인해 주세요.</p>

        <div class="field">
          <label for="email">이메일</label>
          <input class="text-input" id="email" type="email" autocomplete="username" inputmode="email" maxlength="254"
            placeholder="예) researcher@company.com" />
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrap">
            <input class="text-input" id="password" type="password" autocomplete="current-password" maxlength="64"
              placeholder="비밀번호" />
            <button class="toggle-pw" type="button" data-target="password" aria-label="비밀번호 보기">보기</button>
          </div>
        </div>

        <label class="remember">
          <input type="checkbox" id="remember" />
          <span>로그인 상태 유지 <small>· 30일 동안, 공용 PC에서는 끄세요</small></span>
        </label>

        <button class="btn-primary" type="submit" id="submitBtn">로그인</button>
        <p class="form-error" id="formError" role="alert"></p>
        <p class="switch">아직 계정이 없나요? <a href="/signup/" id="signupLink">회원가입</a></p>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <span class="logo">UXA · UX Agents</span>
      <span>만든 사람 [내 이름] · © 2026</span>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // 로그인 뒤 돌아갈 곳 (없으면 마이페이지). 이미 로그인했으면 바로 보낸다
    const nextParam = new URLSearchParams(location.search).get("next");
    const next = UXA.safeNext(nextParam);
    if (UXA.getSession()) location.replace(next);
    $("signupLink").href = UXA.signupUrl(next);
    if (nextParam && next !== "/mypage/") $("loginSub").textContent = "이 화면은 로그인이 필요해요. 로그인하면 보던 화면으로 돌아가요.";

    function showError(msg) {
      $("formError").textContent = msg;
      $("formError").classList.add("show");
    }

    $("password").nextElementSibling.addEventListener("click", (e) => {
      const show = $("password").type === "password";
      $("password").type = show ? "text" : "password";
      e.currentTarget.textContent = show ? "숨기기" : "보기";
    });

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("formError").classList.remove("show");
      const email = $("email").value.trim();
      const password = $("password").value;
      if (!email || !password) { showError("이메일과 비밀번호를 입력해 주세요."); (email ? $("password") : $("email")).focus(); return; }

      $("submitBtn").disabled = true;
      $("submitBtn").textContent = "로그인하는 중…";
      try {
        const res = await fetch(`${UXA.API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, remember: $("remember").checked }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          UXA.setSession(data, data.remember);
          location.href = next;
          return;
        }
        // 이메일과 비밀번호 중 무엇이 틀렸는지는 구분하지 않는다
        showError(data.code === "invalid_credentials" ? "이메일 또는 비밀번호를 확인해 주세요." : data.error || `로그인하지 못했어요. (${res.status})`);
        $("password").value = "";
        $("password").focus();
      } catch {
        showError("서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.");
      } finally {
        $("submitBtn").disabled = false;
        $("submitBtn").textContent = "로그인";
      }
    });
  </script>
</body>
</html>
