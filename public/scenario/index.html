<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시나리오 보드 생성 · UXA</title>
  <meta name="description" content="저니맵을 바탕으로 개선된 사용 시나리오 보드를 만듭니다." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f7fb;
      --text: #14161f;
      --text-sub: #5b6072;
      --line: #e4e6ee;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --radius: 16px;
      --max: 1160px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; min-height: 100vh;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      word-break: keep-all;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

    /* 내비게이션 (랜딩과 동일) */
    .nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .nav .container {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; height: 64px;
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .nav nav { min-width: 0; }
    .menu { display: flex; gap: 4px; list-style: none; overflow-x: auto; }
    .menu a {
      display: block; padding: 8px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 500; color: var(--text-sub); white-space: nowrap;
    }
    .menu a:hover { background: var(--accent-soft); color: var(--accent); }
    .menu a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

    /* 본문 */
    main { flex: 1; padding: 100px 0; background: var(--bg-soft); }
    .page-head { text-align: center; margin-bottom: 48px; }
    .page-head .num {
      display: inline-grid; place-items: center; width: 44px; height: 44px; margin-bottom: 16px;
      border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px;
    }
    .page-head h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
    .page-head p { margin-top: 12px; font-size: 17px; color: var(--text-sub); }
    .notice {
      max-width: 560px; margin: 0 auto; padding: 48px 32px; text-align: center;
      background: #fff; border: 1px dashed var(--accent); border-radius: var(--radius);
    }
    .notice .badge {
      display: inline-block; margin-bottom: 16px; padding: 6px 14px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
    }
    .notice h2 { font-size: 22px; font-weight: 700; }
    .notice p { margin-top: 8px; color: var(--text-sub); font-size: 15px; }

    /* 저니맵에서 불러올 TO-BE 장면 */
    .from-journey { max-width: 820px; margin: 40px auto 0; }
    .from-journey h2 { font-size: 18px; font-weight: 800; }
    .from-journey > p { margin-top: 4px; font-size: 14px; color: var(--text-sub); }
    .from-journey > p a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .scene-groups { display: grid; gap: 14px; margin-top: 16px; }
    .scene-group { padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
    .scene-group.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .scene-group h3 { font-size: 15px; font-weight: 700; }
    .scene-group h3 a:hover { color: var(--accent); }
    .scene-group .meta { font-size: 12.5px; color: var(--text-sub); }
    .scene-group .st { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--bg-soft); font-size: 11.5px; font-weight: 700; }
    .scene-group .st.confirmed { background: #e6f6ef; color: #12805c; }
    .scene-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
    .scene { padding: 12px 14px; border: 1px dashed #c9cdf5; border-radius: 12px; font-size: 13.5px; }
    .scene .no { font-size: 11.5px; font-weight: 800; color: var(--accent); }
    .scene b { display: block; font-size: 14.5px; }
    .scene p { margin-top: 4px; color: var(--text-sub); line-height: 1.55; }
    .scene .hyp { display: inline-block; margin-top: 6px; padding: 0 6px; border-radius: 5px; background: #fff4e0; color: #9a5b00; font-size: 11px; font-weight: 700; }
    .scene .hmw { margin-top: 6px; font-size: 12.5px; color: var(--accent); }

    /* 푸터 (랜딩과 동일) */
    footer { padding: 40px 0; border-top: 1px solid var(--line); }
    footer .container {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
      font-size: 14px; color: var(--text-sub);
    }
    footer .logo { font-size: 18px; color: var(--text); }

    @media (max-width: 640px) {
      .nav .container { flex-direction: column; align-items: flex-start; height: auto; padding-top: 12px; padding-bottom: 8px; gap: 6px; }
      .nav nav { width: 100%; }
      .menu a { padding: 8px 12px 8px 0; }
      .menu a[aria-current="page"] { padding-left: 12px; }
      main { padding: 72px 0; }
      .notice { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container">
      <a href="../index.html" class="logo">UX<span>A</span></a>
      <nav aria-label="에이전트 메뉴">
        <ul class="menu">
          <li><a href="../guide/index.html">인터뷰 가이드</a></li>
          <li><a href="../moderator/index.html">인터뷰 모더레이터</a></li>
          <li><a href="../persona/index.html">페르소나</a></li>
          <li><a href="../journey/index.html">저니맵</a></li>
          <li><a href="../scenario/index.html" aria-current="page">시나리오 보드</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <span class="num">5</span>
        <h1>시나리오 보드 생성</h1>
        <p>저니맵을 바탕으로 개선된 사용 시나리오 보드를 만듭니다.</p>
      </div>
      <div class="notice">
        <span class="badge">Coming soon</span>
        <h2>준비 중입니다</h2>
        <p>이 에이전트는 현재 개발 중이에요. 곧 만나보실 수 있습니다.</p>
      </div>

      <section class="from-journey" aria-labelledby="fjTitle">
        <h2 id="fjTitle">저니맵에서 불러올 TO-BE 핵심 장면</h2>
        <p id="fjNote">4단계 저니맵에서 TO-BE를 만들면, 개선이 가장 크게 체감되는 장면이 여기에 모여요.</p>
        <div class="scene-groups" id="sceneGroups"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <span class="logo">UXA · UX Agents</span>
      <span>만든 사람 [내 이름] · © 2026</span>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    // GET /api/journeys/scenes → { scenes: [{ journeyId, persona, scenario, version, status, scene: { id, title, stageName, description, hmw, hmwText } }] }
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    async function loadScenes() {
      if (!UXA.getSession()) { $("fjNote").innerHTML = `내 저니맵의 장면을 불러오려면 <a href="${UXA.loginUrl("/scenario/")}">로그인</a>해 주세요.`; return; }
      const { res, data } = await UXA.api("/api/journeys/scenes").catch(() => ({ res: { ok: false }, data: {} }));
      if (!res.ok) { $("fjNote").textContent = data.error || "장면을 불러오지 못했어요."; return; }
      const want = new URLSearchParams(location.search).get("journey");
      const groups = new Map();
      for (const x of data.scenes) {
        if (!groups.has(x.journeyId)) groups.set(x.journeyId, { ...x, scenes: [] });
        groups.get(x.journeyId).scenes.push(x.scene);
      }
      if (!groups.size) { $("fjNote").innerHTML = `아직 불러올 장면이 없어요. <a href="/journey/">저니맵</a>에서 AS-IS를 확정하고 ‘TO-BE 만들기’를 눌러 보세요.`; return; }
      $("sceneGroups").innerHTML = [...groups.values()].map((g) => `
        <article class="scene-group ${g.journeyId === want ? "on" : ""}" id="j-${esc(g.journeyId)}">
          <h3><a href="/journey/?id=${encodeURIComponent(g.journeyId)}">${esc(g.persona)} × ${esc(g.scenario)}</a></h3>
          <p class="meta">TO-BE · 버전 ${esc(g.version)}<span class="st ${g.status}">${g.status === "confirmed" ? "확정" : "초안"}</span></p>
          <div class="scene-list">${g.scenes.map((c) => `
            <div class="scene"><span class="no">${esc(c.id)} · ${esc(c.stageName)}</span><b>${esc(c.title)}</b><p>${esc(c.description)}</p>
              ${c.hmwText.length ? `<p class="hmw">${c.hmwText.map(esc).join("<br>")}</p>` : ""}<span class="hyp">가설 · 검증 전</span></div>`).join("")}
          </div>
        </article>`).join("");
      if (want) document.getElementById(`j-${want}`)?.scrollIntoView({ block: "center" });
    }
    loadScenes();
  </script>
</body>
</html>
